version: '3.3'

services:
    postgres:
      image: postgres:17-alpine
      container_name: psgr
      volumes:
        - postgres-data:/var/lib/postgresql/data
      environment:
          - POSTGRES_DB=${DATABASE_NAME}
          - POSTGRES_USER=${DATABASE_USERNAME}
          - POSTGRES_PASSWORD=${DATABASE_PASSWORD}

    backend:
      image: ${USERNAME_DOC}/foodgram_backend
      container_name: foodgram_backend
      restart: always
      ports:
        - "8000:8000"
      env_file: 
        - .env
      command: >
        sh -c "python manage.py migrate &&
        python manage.py collectstatic --noinput &&
        gunicorn --bind 0.0.0.0:8000 foodgram.wsgi"
      volumes:
        - static_volume:/app/static
        - media_volume:/app/media
      depends_on:
        - postgres

    frontend:
      container_name: foodgram_front
      image: ${USERNAME_DOC}/foodgram_frontend
      env_file: 
        - .env
      command: sh -c "cp -r /app/build/* /static/"
      volumes:
        - static_volume:/static

    nginx:
      image: ${USERNAME_DOC}/foodgram_gateway
      ports:
        - 8080:80
      env_file: 
        - .env
      volumes:
        - static_volume:/static/
        - media_volume:/media/
      depends_on:
        - frontend
        - backend


    
volumes:
  postgres-data:
  static_volume:
  media_volume:
